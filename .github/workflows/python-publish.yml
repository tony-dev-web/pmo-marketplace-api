# Publie le paquet « piecemotooccasion » sur PyPI a la creation d'une release.
#
# Pas de jeton : PyPI reconnait ce depot et ce fichier par OpenID Connect
# (« trusted publisher »), d'ou la permission id-token ci-dessous. Le nom du
# fichier et l'environnement « pypi » sont declares cote PyPI : les renommer
# ici casse la publication.
#
# Le paquet vit dans python/ ; le reste du depot est la documentation de
# l'API, qui ne se publie pas.

name: Publier sur PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Les tests avant la construction : une release publiee est definitive
      # sur PyPI, un numero de version ne se reutilise jamais.
      - name: Tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Construire les archives
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: python/dist/

  publier:
    runs-on: ubuntu-latest
    needs: [construire]
    permissions:
      id-token: write          # obligatoire pour la publication de confiance
    environment:
      name: pypi
      url: https://pypi.org/p/piecemotooccasion
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
