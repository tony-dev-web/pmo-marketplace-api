openapi: 3.0.3
info:
  title: API vendeur PieceMotoOccasion
  version: "1.0.0"
  description: >
    Relie n'importe quel logiciel a la marketplace PieceMotoOccasion :
    catalogue, stock, commandes, expedition. Jeton genere dans l'espace
    vendeur. 600 requetes par jeton et par dix minutes.
  license:
    name: MIT
servers:
  - url: https://piecemotooccasion.eu/api/v1
security:
  - jeton: []
components:
  securitySchemes:
    jeton:
      type: http
      scheme: bearer
  schemas:
    Fiche:
      type: object
      required: [reference, titre, prix_ttc, categorie]
      properties:
        reference: {type: string, maxLength: 80, description: Votre identifiant, unique chez vous}
        titre: {type: string, maxLength: 62}
        prix_ttc: {type: number, format: float}
        categorie: {type: string, maxLength: 60, example: Carter}
        stock: {type: integer, default: 1}
        description: {type: string, maxLength: 160}
        information: {type: string, maxLength: 2160}
        marque: {type: string, maxLength: 80}
        modele: {type: string, maxLength: 120}
        annee_min: {type: integer}
        annee_max: {type: integer}
        cylindree: {type: integer}
        poids: {type: integer, description: en grammes}
        etat_achat: {type: string, enum: [Occasion, Neuf]}
        reference_oem: {type: string, maxLength: 40}
        url_boutique: {type: string, maxLength: 250}
        images:
          type: array
          maxItems: 6
          items: {type: string, format: uri}
    Erreur:
      type: object
      properties:
        erreur: {type: string}
paths:
  /moi:
    get:
      summary: Compte, statut, commission, boutique reliee
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                vendeur: Casse Moto Sarthe
                vendeur_id: 42
                statut: valide
                peut_vendre: true
                commission: "12.00"
                boutique: woocommerce
                webhook: https://ma-casse.fr/wp-json/pmo/v1/commande
        "401": {description: Jeton invalide, content: {application/json: {schema: {$ref: "#/components/schemas/Erreur"}}}}
        "429": {description: Trop de requetes}
  /produits:
    get:
      summary: Vos pieces chez PieceMotoOccasion
      responses:
        "200": {description: OK}
    put:
      summary: Creation ou mise a jour par reference (200 fiches par appel)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [produits]
              properties:
                produits:
                  type: array
                  maxItems: 200
                  items: {$ref: "#/components/schemas/Fiche"}
      responses:
        "200":
          description: Pieces acceptees, avec le detail des fiches refusees
          content:
            application/json:
              example:
                produits:
                  - reference: CAR-548
                    id: 1287
                    titre: Carter embrayage XJ 600 Diversion
                    prix_ttc: "29.90"
                    stock: 1
                    categorie: Carter
                    statut: brouillon
                    en_ligne: false
                    url: https://piecemotooccasion.eu/piece/carter-embrayage-xj-600-diversion
                    cree: true
                erreurs:
                  - reference: SEL-12
                    erreur: "categorie est obligatoire (ex : Carenage, Selle, Jante)"
        "400": {description: Aucune fiche acceptee}
  /produits/{reference}/stock:
    patch:
      summary: Met a jour le stock
      parameters:
        - {name: reference, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock]
              properties: {stock: {type: integer, minimum: 0}}
      responses:
        "200": {description: OK}
        "404": {description: Reference inconnue}
  /produits/{reference}:
    delete:
      summary: Retire de la vente (stock a zero), sans effacer
      parameters:
        - {name: reference, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Retiree}
        "404": {description: Reference inconnue}
  /commandes:
    get:
      summary: Commandes payees, lignes et adresse de livraison
      description: >
        Les 500 dernieres commandes payees, de la plus recente a la plus
        ancienne. Le parametre depuis restreint aux commandes posterieures a
        une date, format AAAA-MM-JJ.
      parameters:
        - name: depuis
          in: query
          required: false
          schema: {type: string, format: date}
          example: "2026-09-01"
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                commandes:
                  - id: 1043
                    statut: PAYEE
                    expedition: ""
                    date: "2026-09-13 10:12:00+00:00"
                    suivi: ""
                    livraison:
                      nom: Camille Durand
                      adresse: 12 rue des Lilas
                      code_postal: "72300"
                      ville: Sable-sur-Sarthe
                      pays: France
                      telephone: "0600000000"
                      email: camille@example.com
                      mode: colissimo48
                      relais: null
                    lignes:
                      - reference: CAR-548
                        produit_id: 1287
                        titre: Carter embrayage XJ 600 Diversion
                        quantite: 1
                        prix_ttc: "29.90"
                        total_ttc: "29.90"
                    frais_port: "8.90"
                    total_ttc: "38.80"
  /commandes/{id}/expedier:
    post:
      summary: Transporteur et numero de suivi
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suivi]
              properties:
                transporteur: {type: string, maxLength: 50}
                suivi: {type: string, maxLength: 100}
      responses:
        "200": {description: OK}
        "404": {description: Commande introuvable}
